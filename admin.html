
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Shoes House | Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <header class="admin-header">
    <h2>Friend Shoes House</h2>
    <p>Admin Panel</p>
  </header>

  <main class="admin-container">

    <!-- Login Section -->
    <section id="login-section">
      <h2>Admin Login</h2>

      <form id="login-form">
        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter admin email"
          required
        >

        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >

        <button type="submit">Login</button>
        <p id="login-message"></p>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" hidden>

      <div class="dashboard-header">
        <h2>Dashboard</h2>
        <button type="button" id="logout-btn">Logout</button>
      </div>

      <!-- Product Form -->
      <div class="product-form-container">

        <h2 id="form-heading">Add New Product</h2>

        <form id="product-form">

          <input type="hidden" id="product-id">

          <label>Product Name</label>
          <input
            type="text"
            id="product-name"
            placeholder="Enter product name"
            required
          >

          <label>Product Category</label>
          <select id="product-category" required>
            <option value="">Select Category</option>
            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="Kids">Kids</option>
            <option value="Sports">Sports</option>
            <option value="Casual">Casual</option>
          </select>

          <label>Product Price (₹)</label>
          <input
            type="number"
            id="product-price"
            placeholder="Enter price"
            min="1"
            required
          >

          <!-- Multiple Gallery Images -->
          <label>Product Images (Select Multiple)</label>

          <input
            type="file"
            id="product-images"
            accept="image/*"
            multiple
          >

          <div
            id="image-preview"
            class="image-preview">
          </div>

          <p class="message">
            Select images from your phone gallery.
          </p>

          <div class="form-buttons">
            <button type="submit" id="save-btn">
              Add Product
            </button>

            <button type="button" id="cancel-edit-btn">
              Cancel
            </button>
          </div>

          <p id="product-message"></p>

        </form>
      </div>

      <!-- Products List -->
      <div class="products-container">

        <h2>All Products</h2>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="admin-product-list">
              <!-- Products will load here -->
            </tbody>
          </table>
        </div>

      </div>

    </section>

  </main>

  <script type="module" src="admin.js"></script>

</body>
</html>
